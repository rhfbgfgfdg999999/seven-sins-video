<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>七宗罪 · Seven Sins</title><style>
:root{--bg:#0a0a0f;--fg:#eee;--c:#b99bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif}
header{padding:20px 16px 8px;text-align:center}h1{margin:0;font-size:26px;letter-spacing:.3em}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 16px}
nav button{background:#16161f;color:var(--fg);border:1px solid #2a2a38;border-radius:20px;padding:6px 14px;cursor:pointer}
nav button.on{border-color:var(--c);color:var(--c);box-shadow:0 0 12px var(--c)}
main{max-width:960px;margin:0 auto;padding:8px 16px 40px}
video{width:100%;background:#000;border-radius:10px;aspect-ratio:16/9;box-shadow:0 0 40px -10px var(--c)}
.box{background:#12121a;border:1px solid #23232f;border-radius:10px;padding:12px;margin-top:12px}
.box b{color:var(--c)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.cp{background:var(--c);color:#000;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}
#drop{margin-top:12px;border:1px dashed #444;border-radius:10px;padding:14px;text-align:center;color:#999}
</style></head><body>
<header><h1>七宗罪</h1><div style="color:#888">SEPTEM PECCATA MORTALIA</div></header>
<nav id="nav"></nav>
<main><video id="v" controls playsinline loop></video>
<div class="box"><div class="row"><span><b>标题</b> <span id="t"></span></span><button class="cp" data-k="t">复制</button></div></div>
<div class="box"><div class="row"><span><b>标签</b> <span id="g"></span></span><button class="cp" data-k="g">复制</button></div></div>
<div id="drop">视频不在 ./videos/ 里？把 mp4 拖到这里或 <input type="file" id="f" accept="video/*" multiple> 选择（按文件名里的编号对应）</div></main>
<script>
const D=[{"i": 1, "key": "pride", "cn": "傲慢", "latin": "SUPERBIA", "title": "我同时发布了七宗罪，你分配到了「傲慢」！ 七宗罪之首", "tags": "#七宗罪 #七宗罪系列 #傲慢 #vibe知识大赏 #新星计划", "color": "#9e6bff", "file": "videos/01_傲慢.mp4"}, {"i": 2, "key": "envy", "cn": "嫉妒", "latin": "INVIDIA", "title": "我同时发布了七宗罪，你分配到了「嫉妒」！ 最见不得别人好的罪", "tags": "#七宗罪 #七宗罪系列 #嫉妒 #vibe知识大赏 #新星计划", "color": "#38ff84", "file": "videos/02_嫉妒.mp4"}, {"i": 3, "key": "wrath", "cn": "暴怒", "latin": "IRA", "title": "我同时发布了七宗罪，你分配到了「暴怒」！ 一点就着的罪", "tags": "#七宗罪 #七宗罪系列 #暴怒 #vibe知识大赏 #新星计划", "color": "#ff3321", "file": "videos/03_暴怒.mp4"}, {"i": 4, "key": "sloth", "cn": "懒惰", "latin": "ACEDIA", "title": "我同时发布了七宗罪，你分配到了「懒惰」！ 最容易被原谅的罪", "tags": "#七宗罪 #七宗罪系列 #懒惰 #vibe知识大赏 #新星计划", "color": "#7ab7ff", "file": "videos/04_懒惰.mp4"}, {"i": 5, "key": "greed", "cn": "贪婪", "latin": "AVARITIA", "title": "我同时发布了七宗罪，你分配到了「贪婪」！ 永远填不满的罪", "tags": "#七宗罪 #七宗罪系列 #贪婪 #vibe知识大赏 #新星计划", "color": "#ffc13d", "file": "videos/05_贪婪.mp4"}, {"i": 6, "key": "gluttony", "cn": "暴食", "latin": "GULA", "title": "我同时发布了七宗罪，你分配到了「暴食」！ 最好吃的罪", "tags": "#七宗罪 #七宗罪系列 #暴食 #vibe知识大赏 #新星计划", "color": "#ff7016", "file": "videos/06_暴食.mp4"}, {"i": 7, "key": "lust", "cn": "色欲", "latin": "LUXURIA", "title": "我同时发布了七宗罪，你分配到了「色欲」！ 七宗罪之末", "tags": "#七宗罪 #七宗罪系列 #色欲 #vibe知识大赏 #新星计划", "color": "#ff51a8", "file": "videos/07_色欲.mp4"}];let cur=0;const $=id=>document.getElementById(id),local={};
const nav=$('nav');D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.i+' '+d.cn;b.onclick=()=>go(i);nav.appendChild(b)});
function go(i){cur=i;const d=D[i];document.documentElement.style.setProperty('--c',d.color);
[...nav.children].forEach((b,j)=>b.classList.toggle('on',j==i));
$('v').src=local[d.i]||d.file;$('v').play().catch(()=>{});$('t').textContent=d.title;$('g').textContent=d.tags}
document.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText($(b.dataset.k).textContent);b.textContent='已复制';setTimeout(()=>b.textContent='复制',900)});
function take(fs){[...fs].forEach(f=>{const m=f.name.match(/^(\d+)/);if(m)local[+m[1]]=URL.createObjectURL(f)});go(cur)}
$('f').onchange=e=>take(e.target.files);
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();take(e.dataTransfer.files)});
$('v').addEventListener('ended',()=>go((cur+1)%D.length));
go(0);
</script></body></html>
